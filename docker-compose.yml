services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: maint
      POSTGRES_PASSWORD: maint
      POSTGRES_DB: maint
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maint"]
      interval: 3s
      retries: 10
  web:
    build: .
    ports: ["5000:5000"]
    environment:
      DATABASE_URL: postgresql://maint:maint@db:5432/maint
    depends_on:
      db: { condition: service_healthy }
